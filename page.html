<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>OSS 网盘</title
  ><link rel="icon" href="/logo.svg?v=2" />
  ><style>
    body {
      margin: 0;
      background: #fff;
      color: #222;
      font:
        14px -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 20px 14px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 20px;
      font-weight: 400;
    }
    .logo {
      width: 24px;
      height: 24px;
    }
    .muted {
      color: #7c8799;
      font-size: 13px;
    }
    .drop {
      position: relative;
      margin: 18px 0;
      padding: 24px;
      text-align: center;
      border: 1px dashed #b8bec8;
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #e7edf7 var(--progress, 0%),
        #fafafa var(--progress, 0%)
      );
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .drop:hover {
      border-color: #7d8795;
      background: linear-gradient(
        90deg,
        #dfe8f6 var(--progress, 0%),
        #f7f8fa var(--progress, 0%)
      );
    }
    #upload-status {
      position: absolute;
      right: 18px;
      min-width: 150px;
      text-align: right;
      color: #222;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 2px 10px;
    }
    .bar-left,
    .bar-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .bar-left {
      overflow: hidden;
      gap: 8px;
    }
    .bar-left > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-right {
      flex: 0 0 auto;
      justify-content: flex-end;
      gap: 12px;
    }
    #usage {
      white-space: nowrap;
      font-size: 12px;
      color: #a0a8b5;
    }
    .list {
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 100px 170px 135px;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid #eee;
      align-items: center;
      transition: background-color 0.15s ease;
    }
    .row[data-folder],
    .row[data-download] {
      cursor: pointer;
    }
    .row:not(.muted):hover {
      background: #f5f8fc;
    }
    .row:last-child {
      border: 0;
    }
    .folder {
      color: #2866d8;
      cursor: pointer;
      font-weight: 600;
    }
    .folder:hover {
      text-decoration: underline;
    }
    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      border: 0;
      padding: 0 5px;
      background: transparent;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    button.action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid #d7dce5;
      border-radius: 7px;
      background: #fff;
      color: #315da8;
      text-decoration: none;
      line-height: 1;
    }
    button.action .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      line-height: 0;
    }
    button.action:hover {
      border-color: #aeb8ca;
      background: #f6f8fc;
    }
    button.action svg {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    button.action.danger {
      color: #b04452;
    }
    label {
      display: block;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }
    input {
      display: none;
    }
    button.alt {
      color: #0645ad;
      background: transparent;
    }
    .ops {
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }
    .ops button {
      font-size: 13px;
      padding: 0 4px;
    }
    .empty {
      text-align: center;
      padding: 28px;
      color: #888;
    }
    .mkdir-form {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 20px;
      background: rgb(0 0 0 / 18%);
    }
    .mkdir-box {
      box-sizing: border-box;
      width: 100%;
      max-width: 320px;
      min-width: 0;
      padding: 20px;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 30px rgb(0 0 0 / 12%);
    }
    .mkdir-title {
      margin-bottom: 12px;
      font-size: 16px;
    }
    .mkdir-form input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #c8ced8;
      border-radius: 8px;
      font: inherit;
    }
    .mkdir-hint {
      margin-top: 8px;
      color: #7c8799;
      font-size: 12px;
    }
    .mkdir-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }
    .mkdir-actions button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid #d7dce5;
      border-radius: 7px;
      color: #315da8;
      background: #fff;
      text-decoration: none;
      line-height: 1;
    }
    .mkdir-actions button:hover {
      border-color: #aeb8ca;
      background: #f6f8fc;
    }
    .mkdir-actions #mkdir-submit {
      border-color: #b8cceb;
      background: #eef4ff;
    }
    input {
      display: none;
    }
    @media (max-width: 650px) {
      .wrap {
        padding: 16px 10px;
      }
      .drop {
        display: flex;
        min-height: 58px;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        padding: 14px 12px;
      }
      #upload-status {
        position: static;
        min-width: 0;
        margin-top: 5px;
        text-align: center;
        font-size: 12px;
      }
      .bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-top: 16px;
      }
      .bar-left {
        width: 100%;
      }
      .bar-right {
        width: 100%;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 10px;
      }
      .bar-right #usage {
        text-align: right;
      }
      .row {
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 10px 9px;
        min-width: 0;
      }
      .row > :nth-child(2),
      .row .date {
        display: none;
      }
      .ops {
        justify-self: end;
        max-width: 100%;
        flex-wrap: wrap;
        gap: 4px;
      }
      button.action {
        padding: 0 7px;
      }
      .mkdir-box {
        width: 100%;
        max-width: 320px;
        padding: 18px;
      }
    }
  </style>
  <main class="wrap">
    <header class="head">
      <div>
        <div class="brand">
          <img class="logo" src="/logo.svg?v=2" alt="" />
          OSS 网盘
        </div>
      </div>
      <div></div>
    </header>
    <section id="drop" class="drop" onclick="$('file').click()">
      <span id="drop-title">点击或拖拽文件上传</span
      ><span id="upload-status"></span><input id="file" type="file" multiple />
    </section>
    <div class="bar">
      <div class="bar-left">
        <button type="button" id="back" hidden>返回上级</button>
        <span id="crumb" class="muted">根目录</span>
      </div>
      <div class="bar-right">
        <span id="usage" class="muted"></span>
        <button type="button" class="action" id="mkdir">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7.5h7l2 2h9v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M12 12v5M9.5 14.5h5" />
          </svg>
          新建目录
        </button>
      </div>
    </div>
    <div id="mkdir-form" class="mkdir-form">
      <div class="mkdir-box">
        <div class="mkdir-title">新建目录</div>
        <input
          id="mkdir-name"
          type="text"
          placeholder="输入目录名称"
          maxlength="64"
        />
        <div id="mkdir-hint" class="mkdir-hint">
          仅支持中文、英文、数字、- 和 _
        </div>
        <div class="mkdir-actions">
          <button type="button" id="mkdir-cancel">取消</button>
          <button type="button" id="mkdir-submit">创建</button>
        </div>
      </div>
    </div>
    <section class="list">
      <div class="row muted">
        <b>名称</b><b>大小</b><b class="date">修改时间</b><b></b>
      </div>
      <div id="items"></div>
    </section>
  </main>
  <script src="/app.js?v=2" defer></script>
</html>
