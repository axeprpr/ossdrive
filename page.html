<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OSS 网盘</title>
  <link rel="icon" href="/logo.svg?v=3" />
  <link rel="stylesheet" href="/vendor/pico.min.css" />
  <style>
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: #fbfdf8;
      color: #26332b;
      font:
        14px -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      height: 100dvh;
      max-width: 760px;
      margin: auto;
      padding: 16px 14px 12px;
      overflow: hidden;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 20px;
      font-weight: 400;
    }
    .brand-link {
      color: inherit;
      text-decoration: none;
    }
    .brand-link:hover,
    .brand-link:focus {
      text-decoration: none;
    }
    .logo {
      width: 24px;
      height: 24px;
    }
    .muted {
      color: #7c8799;
      font-size: 13px;
    }
    .drop {
      position: relative;
      flex: 0 0 auto;
      margin: 14px 0;
      padding: 18px;
      text-align: center;
      border: 1px dashed #b8bec8;
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #e7edf7 var(--progress, 0%),
        #fafafa var(--progress, 0%)
      );
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .drop:hover {
      border-color: #8fac94;
      background: linear-gradient(
        90deg,
        #dfe8f6 var(--progress, 0%),
        #f7f8fa var(--progress, 0%)
      );
    }
    #upload-status {
      position: absolute;
      right: 18px;
      min-width: 150px;
      text-align: right;
      color: #222;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 4px 2px 8px;
      min-height: 34px;
    }
    .bar-left,
    .bar-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .bar-left {
      overflow: hidden;
      gap: 8px;
    }
    #crumb { cursor: pointer; }
    #crumb {
      overflow: hidden;
      padding: 3px 5px;
      color: #5d8067;
      text-overflow: ellipsis;
      text-decoration: none;
      white-space: nowrap;
    }
    #crumb:hover { color: #376044; }
    .bar-left > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-right {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      height: 32px;
      justify-content: flex-end;
      gap: 6px;
    }
    .bar-right [role="group"] {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      width: auto;
      margin: 0;
      gap: 6px;
      height: 32px;
    }
    .bar-right button.action { width: auto !important; min-width: max-content; white-space: nowrap; }
    #usage {
      white-space: nowrap;
      font-size: 12px;
      color: #829488;
    }
    .list {
      flex: 1 1 auto;
      min-height: 170px;
      border: 1px solid #dce7dc;
      border-radius: 10px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      background: #fff;
    }
    .row {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr) 88px 145px 196px;
      gap: 8px;
      padding: 7px 9px;
      border-bottom: 1px solid #edf2ec;
      align-items: center;
      transition: background-color 0.15s ease;
    }
    .row[data-folder],
    .row[data-download] {
      cursor: pointer;
    }
    .row:not(.muted):hover {
      background: #f3f8f1;
    }
    .row:last-child {
      border: 0;
    }
    .folder {
      color: #4f7c5b;
      cursor: pointer;
      font-weight: 600;
    }
    .folder:hover {
      color: #315f3d;
    }
    .name {
      position: relative;
      min-width: 0;
      border-bottom: 0 !important;
      text-decoration: none !important;
    }
    .name-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .name[data-tooltip]:hover::after {
      position: absolute;
      top: calc(100% + 7px);
      left: 0;
      z-index: 8;
      max-width: min(420px, 70vw);
      padding: 6px 9px;
      border: 1px solid #d8e5d8;
      border-radius: 8px;
      background: #fffffc;
      box-shadow: 0 5px 18px rgb(61 85 65 / 14%);
      color: #34463a;
      content: attr(data-tooltip);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.45;
      white-space: normal;
      word-break: break-all;
    }
    button {
      border: 0;
      width: auto;
      margin: 0;
      padding: 0 5px;
      background: transparent;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    button.action {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid #cfdfd0;
      border-radius: 8px;
      background: #fffffc;
      color: #4d7657;
      text-decoration: none;
      line-height: 1;
    }
    button.action .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      line-height: 0;
    }
    button.action:hover {
      border-color: #9fbea4;
      background: #f2f8f1;
    }
    button.action svg {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    button.action.danger {
      color: #a35b61;
    }
    button.action.deleting {
      width: 66px;
      justify-content: center;
    }
    .spinner {
      width: 14px;
      height: 14px;
      box-sizing: border-box;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .select-cell { display: flex; justify-content: center; }
    .file-check { display: block; width: 15px; height: 15px; margin: 0; }
    .tools {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      flex: 0 0 auto;
      gap: 6px;
      margin: 0 2px 10px;
      padding: 0;
      border: 0;
      background: transparent;
    }
    .tools input[type="search"], .tools select {
      display: block;
      box-sizing: border-box;
      height: 32px;
      margin: 0;
      padding: 0 9px;
      border: 1px solid #c8ced8;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font: inherit;
    }
    .tools input[type="search"] { flex: 0 1 280px; width: 280px; min-width: 180px; }
    .tools select { flex: 0 0 auto !important; width: auto !important; min-width: 86px; }
    .tools button.action { flex: 0 0 auto; white-space: nowrap; }
    .tools [role="group"] {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 6px;
      margin: 0;
      width: auto;
    }
    .tools .action:disabled, .pager button:disabled { cursor: not-allowed; opacity: .45; }
    .pager {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 34px;
      padding: 5px 4px 0;
    }
    .pager select {
      width: auto !important;
      min-width: 84px;
      height: 30px;
      margin: 0 8px 0 0;
      padding: 0 8px;
      border-color: #cfdfd0;
      border-radius: 8px;
      background-color: #fffffc;
      font-size: 12px;
    }
    .pager button {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid #cfdfd0;
      border-radius: 8px;
      background: #fffffc;
      color: #4d7657;
      text-decoration: none;
    }
    .pager button:hover:not(:disabled) { border-color: #9fbea4; background: #f2f8f1; }
    #page-info { min-width: 125px; text-align: center; color: #7c8799; font-size: 12px; }
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: rgb(0 0 0 / 35%);
    }
    .preview-modal.visible { display: flex; }
    .preview-box {
      display: flex;
      flex-direction: column;
      width: min(900px, 100%);
      max-height: min(800px, 90vh);
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 40px rgb(0 0 0 / 20%);
    }
    .preview-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #eee; }
    .preview-head h2 { overflow: hidden; margin: 0; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body { overflow: auto; padding: 16px; }
    .preview-image, .preview-video { display: block; max-width: 100%; max-height: 70vh; margin: auto; }
    .preview-text { overflow: auto; margin: 0; white-space: pre-wrap; word-break: break-word; }
    .markdown-body { line-height: 1.6; }
    .markdown-body img { max-width: 100%; }
    .preview-loading { color: #7c8799; text-align: center; }
    :root {
      --pico-font-size: 14px;
      --pico-primary: #5f8969;
      --pico-primary-hover: #416e4d;
      --pico-primary-focus: rgb(95 137 105 / 18%);
      --pico-form-element-spacing-vertical: .38rem;
      --pico-form-element-spacing-horizontal: .6rem;
    }
    body { background: #fbfdf8; }
    .head { padding: 0 2px 2px; }
    .brand { letter-spacing: .01em; }
    .drop {
      box-shadow: 0 2px 8px rgb(36 64 108 / 4%);
    }
    .tools input[type="search"], .tools select {
      border-color: #cfdfd0;
      box-shadow: none;
      font-size: 12px;
    }
    .tools input[type="search"]:focus, .tools select:focus,
    .mkdir-form input:focus {
      border-color: #8fb398;
      box-shadow: 0 0 0 2px rgb(95 137 105 / 10%);
    }
    button.action {
      min-height: 28px;
      border-color: #cfdfd0;
      font-size: 12px;
      box-shadow: none;
    }
    button.action:hover { transform: none; box-shadow: none; }
    .list {
      box-shadow: 0 2px 10px rgb(36 64 108 / 4%);
    }
    .row { min-height: 38px; }
    .row.muted {
      position: sticky;
      top: 0;
      z-index: 5;
      min-height: 30px;
      padding-top: 4px;
      padding-bottom: 4px;
      background: #f4f8f2;
    }
    .sort-head {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 5px;
      min-height: 20px;
      padding: 0;
      border: 0;
      color: #68786c;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: none;
      outline: none;
      width: auto !important;
    }
    #sort-name { padding-left: 30px; }
    }
    .sort-head:hover, .sort-head:focus, .sort-head:active, .sort-head.active {
      color: #4f7659;
      background: transparent;
      box-shadow: none;
      outline: none;
    }
    .sort-icon {
      display: inline-flex;
      flex-direction: column;
      gap: 0;
      width: 9px;
      color: #aab7ac;
      font-size: 7px;
      line-height: 6px;
      text-align: center;
    }
    .sort-head.active .sort-icon { color: #5f8969; font-size: 9px; line-height: 10px; }
    .sort-label { white-space: nowrap; }
    .pager button { font-size: 12px; }
    .mkdir-box, .preview-box { box-shadow: 0 12px 36px rgb(31 51 84 / 16%); }
    label {
      display: block;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }
    input {
      display: none;
    }
    button.alt {
      color: #0645ad;
      background: transparent;
    }
    .ops {
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }
    .ops button {
      font-size: 13px;
      padding: 0 4px;
    }
    .empty {
      text-align: center;
      padding: 28px;
      color: #888;
    }
    .mkdir-form {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 20px;
      background: rgb(0 0 0 / 18%);
    }
    .mkdir-box {
      box-sizing: border-box;
      width: 100%;
      max-width: 480px;
      min-width: 0;
      padding: 20px;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 30px rgb(0 0 0 / 12%);
    }
    .mkdir-title {
      margin-bottom: 12px;
      font-size: 16px;
    }
    .mkdir-form input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 9px 10px;
      border: 1px solid #c8ced8;
      border-radius: 8px;
      font: inherit;
    }
    .mkdir-hint {
      margin-top: 8px;
      color: #7c8799;
      font-size: 12px;
    }
    .mkdir-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }
    .mkdir-actions button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid #d7dce5;
      border-radius: 7px;
      color: #315da8;
      background: #fff;
      text-decoration: none;
      line-height: 1;
    }
    .mkdir-actions button:hover {
      border-color: #aeb8ca;
      background: #f6f8fc;
    }
    .mkdir-actions #mkdir-submit {
      border-color: #b8cceb;
      background: #eef4ff;
    }
    input {
      display: none;
    }
    @media (max-width: 650px) {
      .wrap {
        padding: 12px 9px 8px;
      }
      .drop {
        display: flex;
        min-height: 58px;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        padding: 14px 12px;
      }
      #upload-status {
        position: static;
        min-width: 0;
        margin-top: 5px;
        text-align: center;
        font-size: 12px;
      }
      .bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-top: 16px;
        min-height: 0;
      }
      .bar-left {
        width: 100%;
      }
      .bar-right {
        width: 100%;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px 10px;
        height: auto;
      }
      .bar-right #usage {
        text-align: right;
      }
      .row {
        grid-template-columns: 24px minmax(0, 1fr) auto;
        padding: 10px 9px;
        min-width: 0;
      }
      .row > :nth-child(3),
      .row .date {
        display: none;
      }
      .ops {
        justify-self: end;
        max-width: 100%;
        flex-wrap: wrap;
        gap: 4px;
      }
      button.action {
        padding: 0 7px;
      }
      .tools { align-items: stretch; }
      .tools { flex-wrap: wrap; }
      .tools input[type="search"] { flex: 1 1 100%; }
      .tools input[type="search"] { width: 100%; min-width: 0; }
      .pager { gap: 5px; }
      .pager select { margin-right: 0; min-width: 78px; }
      .mkdir-box {
        width: 100%;
        max-width: 320px;
        padding: 18px;
      }
    }
  </style>
  </head>
  <body>
  <main class="wrap">
    <header class="head">
      <div>
        <a class="brand brand-link" href="https://axe3.cn" target="_blank" rel="noopener noreferrer">
          <img class="logo" src="/logo.svg?v=3" alt="" />
          OSS 网盘
        </a>
      </div>
      <div></div>
    </header>
    <section id="drop" class="drop">
      <span id="drop-title">点击或拖拽文件上传</span
      ><span id="upload-status"></span><input id="file" type="file" multiple />
    </section>
    <div class="bar">
      <div class="bar-left">
        <span id="crumb" class="muted">根目录</span>
      </div>
      <div class="bar-right">
        <span id="usage" class="muted"></span>
        <button type="button" class="action" id="mkdir">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7.5h7l2 2h9v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M12 12v5M9.5 14.5h5" />
          </svg>
          新建目录
        </button>
        <div role="group" aria-label="批量操作">
          <button type="button" class="action" id="batch-download" disabled>批量下载</button>
          <button type="button" class="action danger" id="batch-delete" disabled>批量删除</button>
        </div>
      </div>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="搜索当前目录" aria-label="搜索当前目录" />
    </div>
    <div id="mkdir-form" class="mkdir-form">
      <div class="mkdir-box">
        <div class="mkdir-title">新建目录</div>
        <input
          id="mkdir-name"
          type="text"
          placeholder="输入目录名称"
          maxlength="64"
        />
        <div id="mkdir-hint" class="mkdir-hint">
          仅支持中文、英文、数字、- 和 _
        </div>
        <div class="mkdir-actions">
          <button type="button" id="mkdir-cancel">取消</button>
          <button type="button" id="mkdir-submit">创建</button>
        </div>
      </div>
    </div>
    <section class="list">
      <div class="row muted">
        <b></b><button type="button" class="sort-head" id="sort-name" data-label="名称" aria-sort="ascending"><span class="sort-label">名称</span><span class="sort-icon" aria-hidden="true">▲▼</span></button><button type="button" class="sort-head" id="sort-size" data-label="大小" aria-sort="none"><span class="sort-label">大小</span><span class="sort-icon" aria-hidden="true">▲▼</span></button><button type="button" class="sort-head date" id="sort-modified" data-label="修改时间" aria-sort="none"><span class="sort-label">修改时间</span><span class="sort-icon" aria-hidden="true">▲▼</span></button><b></b>
      </div>
      <div id="items"></div>
    </section>
    <div class="pager">
      <select id="page-size" aria-label="每页数量">
        <option value="10">10 条/页</option>
        <option value="30">30 条/页</option>
        <option value="50">50 条/页</option>
      </select>
      <button type="button" id="prev-page" disabled>上一页</button>
      <span id="page-info"></span>
      <button type="button" id="next-page" disabled>下一页</button>
    </div>
  </main>
  <div id="preview-modal" class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="preview-box">
      <div class="preview-head"><h2 id="preview-title">预览</h2><button type="button" id="preview-close" aria-label="关闭">×</button></div>
      <div id="preview-body" class="preview-body"></div>
    </div>
  </div>
  <script src="/vendor/marked.min.js" defer></script>
  <script src="/vendor/purify.min.js" defer></script>
  <script src="/app.js?v=3" defer></script>
  </body>
</html>
