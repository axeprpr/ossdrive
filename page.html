<!doctype html>
<html lang="zh-CN" data-theme="light">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>OSS 网盘</title
  ><link rel="icon" href="/logo.svg?v=3" />
  ><link rel="stylesheet" href="/vendor/pico.min.css" />
  ><style>
    body {
      margin: 0;
      background: #fff;
      color: #222;
      font:
        14px -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }
    .wrap {
      max-width: 760px;
      margin: auto;
      padding: 20px 14px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 20px;
      font-weight: 400;
    }
    .brand-link {
      color: inherit;
      text-decoration: none;
    }
    .logo {
      width: 24px;
      height: 24px;
    }
    .muted {
      color: #7c8799;
      font-size: 13px;
    }
    .drop {
      position: relative;
      margin: 18px 0;
      padding: 24px;
      text-align: center;
      border: 1px dashed #b8bec8;
      border-radius: 12px;
      background: linear-gradient(
        90deg,
        #e7edf7 var(--progress, 0%),
        #fafafa var(--progress, 0%)
      );
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .drop:hover {
      border-color: #7d8795;
      background: linear-gradient(
        90deg,
        #dfe8f6 var(--progress, 0%),
        #f7f8fa var(--progress, 0%)
      );
    }
    #upload-status {
      position: absolute;
      right: 18px;
      min-width: 150px;
      text-align: right;
      color: #222;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 2px 10px;
    }
    .bar-left,
    .bar-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }
    .bar-left {
      overflow: hidden;
      gap: 8px;
    }
    .bar-left > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-right {
      flex: 0 0 auto;
      justify-content: flex-end;
      gap: 12px;
    }
    #usage {
      white-space: nowrap;
      font-size: 12px;
      color: #a0a8b5;
    }
    .list {
      border: 1px solid #dfe3e8;
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 100px 170px 210px;
      gap: 8px;
      padding: 9px 10px;
      border-bottom: 1px solid #eee;
      align-items: center;
      transition: background-color 0.15s ease;
    }
    .row[data-folder],
    .row[data-download] {
      cursor: pointer;
    }
    .row:not(.muted):hover {
      background: #f5f8fc;
    }
    .row:last-child {
      border: 0;
    }
    .folder {
      color: #2866d8;
      cursor: pointer;
      font-weight: 600;
    }
    .folder:hover {
      color: #1d4fae;
    }
    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      border: 0;
      width: auto;
      margin: 0;
      padding: 0 5px;
      background: transparent;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      font-size: 13px;
    }
    button.action {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid #d7dce5;
      border-radius: 7px;
      background: #fff;
      color: #315da8;
      text-decoration: none;
      line-height: 1;
    }
    button.action .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      line-height: 0;
    }
    button.action:hover {
      border-color: #aeb8ca;
      background: #f6f8fc;
    }
    button.action svg {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    button.action.danger {
      color: #b04452;
    }
    button.action.deleting {
      width: 66px;
      justify-content: center;
    }
    .spinner {
      width: 14px;
      height: 14px;
      box-sizing: border-box;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .select-cell { display: flex; justify-content: center; }
    .file-check { display: block; width: 15px; height: 15px; margin: 0; }
    .tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 2px 10px;
    }
    .tools input[type="search"], .tools select {
      display: block;
      box-sizing: border-box;
      height: 32px;
      margin: 0;
      padding: 0 9px;
      border: 1px solid #c8ced8;
      border-radius: 7px;
      background: #fff;
      color: #222;
      font: inherit;
    }
    .tools input[type="search"] { flex: 1 1 180px; min-width: 130px; }
    .tools select { min-width: 86px; }
    .tools .action:disabled, .pager button:disabled { cursor: not-allowed; opacity: .45; }
    #selected-count { color: #7c8799; font-size: 12px; margin-left: auto; }
    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 8px 2px;
    }
    .pager button { text-decoration: none; }
    #page-info { min-width: 125px; text-align: center; color: #7c8799; font-size: 12px; }
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      background: rgb(0 0 0 / 35%);
    }
    .preview-modal.visible { display: flex; }
    .preview-box {
      display: flex;
      flex-direction: column;
      width: min(900px, 100%);
      max-height: min(800px, 90vh);
      overflow: hidden;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 40px rgb(0 0 0 / 20%);
    }
    .preview-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #eee; }
    .preview-head h2 { overflow: hidden; margin: 0; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body { overflow: auto; padding: 16px; }
    .preview-image, .preview-video { display: block; max-width: 100%; max-height: 70vh; margin: auto; }
    .preview-text { overflow: auto; margin: 0; white-space: pre-wrap; word-break: break-word; }
    .markdown-body { line-height: 1.6; }
    .markdown-body img { max-width: 100%; }
    .preview-loading { color: #7c8799; text-align: center; }
    :root {
      --pico-font-size: 14px;
      --pico-primary: #2866d8;
      --pico-primary-hover: #1d4fae;
      --pico-primary-focus: rgb(40 102 216 / 18%);
      --pico-form-element-spacing-vertical: .38rem;
      --pico-form-element-spacing-horizontal: .6rem;
    }
    body { background: #fff; }
    .wrap { padding-top: 22px; }
    .head { padding: 0 2px 2px; }
    .brand { letter-spacing: .01em; }
    .drop {
      box-shadow: 0 2px 8px rgb(36 64 108 / 4%);
    }
    .bar { margin-top: 20px; }
    .tools {
      padding: 8px;
      border: 1px solid #e3e8f0;
      border-radius: 9px;
      background: #fbfcfe;
    }
    .tools input[type="search"], .tools select {
      border-color: #d4dbe6;
      box-shadow: none;
      font-size: 12px;
    }
    .tools input[type="search"]:focus, .tools select:focus,
    .mkdir-form input:focus {
      border-color: #8eafe8;
      box-shadow: 0 0 0 2px rgb(40 102 216 / 10%);
    }
    button.action {
      min-height: 28px;
      border-color: #d4dbe6;
      font-size: 12px;
      box-shadow: none;
    }
    button.action:hover { transform: none; box-shadow: none; }
    .list {
      box-shadow: 0 2px 10px rgb(36 64 108 / 4%);
    }
    .row { min-height: 42px; }
    .row.muted { min-height: 36px; background: #fbfcfe; }
    .pager button { font-size: 12px; }
    .mkdir-box, .preview-box { box-shadow: 0 12px 36px rgb(31 51 84 / 16%); }
    label {
      display: block;
      color: #0645ad;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 8px;
    }
    input {
      display: none;
    }
    button.alt {
      color: #0645ad;
      background: transparent;
    }
    .ops {
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }
    .ops button {
      font-size: 13px;
      padding: 0 4px;
    }
    .empty {
      text-align: center;
      padding: 28px;
      color: #888;
    }
    .mkdir-form {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 20px;
      background: rgb(0 0 0 / 18%);
    }
    .mkdir-box {
      box-sizing: border-box;
      width: 100%;
      max-width: 480px;
      min-width: 0;
      padding: 20px;
      border: 1px solid #dfe3e8;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 30px rgb(0 0 0 / 12%);
    }
    .mkdir-title {
      margin-bottom: 12px;
      font-size: 16px;
    }
    .mkdir-form input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 9px 10px;
      border: 1px solid #c8ced8;
      border-radius: 8px;
      font: inherit;
    }
    .mkdir-hint {
      margin-top: 8px;
      color: #7c8799;
      font-size: 12px;
    }
    .mkdir-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }
    .mkdir-actions button {
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid #d7dce5;
      border-radius: 7px;
      color: #315da8;
      background: #fff;
      text-decoration: none;
      line-height: 1;
    }
    .mkdir-actions button:hover {
      border-color: #aeb8ca;
      background: #f6f8fc;
    }
    .mkdir-actions #mkdir-submit {
      border-color: #b8cceb;
      background: #eef4ff;
    }
    input {
      display: none;
    }
    @media (max-width: 650px) {
      .wrap {
        padding: 16px 10px;
      }
      .drop {
        display: flex;
        min-height: 58px;
        box-sizing: border-box;
        flex-direction: column;
        justify-content: center;
        padding: 14px 12px;
      }
      #upload-status {
        position: static;
        min-width: 0;
        margin-top: 5px;
        text-align: center;
        font-size: 12px;
      }
      .bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-top: 16px;
      }
      .bar-left {
        width: 100%;
      }
      .bar-right {
        width: 100%;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px 10px;
      }
      .bar-right #usage {
        text-align: right;
      }
      .row {
        grid-template-columns: 24px minmax(0, 1fr) auto;
        padding: 10px 9px;
        min-width: 0;
      }
      .row > :nth-child(3),
      .row .date {
        display: none;
      }
      .ops {
        justify-self: end;
        max-width: 100%;
        flex-wrap: wrap;
        gap: 4px;
      }
      button.action {
        padding: 0 7px;
      }
      .tools { align-items: stretch; }
      .tools input[type="search"] { flex-basis: 100%; }
      #selected-count { margin-left: 0; }
      .mkdir-box {
        width: 100%;
        max-width: 320px;
        padding: 18px;
      }
    }
  </style>
  <main class="wrap">
    <header class="head">
      <div>
        <a class="brand brand-link" href="https://axe3.cn" target="_blank" rel="noopener noreferrer">
          <img class="logo" src="/logo.svg?v=3" alt="" />
          OSS 网盘
        </a>
      </div>
      <div></div>
    </header>
    <section id="drop" class="drop">
      <span id="drop-title">点击或拖拽文件上传</span
      ><span id="upload-status"></span><input id="file" type="file" multiple />
    </section>
    <div class="bar">
      <div class="bar-left">
        <button type="button" id="back" hidden>返回上级</button>
        <span id="crumb" class="muted">根目录</span>
      </div>
      <div class="bar-right">
        <span id="usage" class="muted"></span>
        <button type="button" class="action" id="mkdir">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7.5h7l2 2h9v8.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M12 12v5M9.5 14.5h5" />
          </svg>
          新建目录
        </button>
      </div>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="搜索当前目录" aria-label="搜索当前目录" />
      <select id="sort-by" aria-label="排序方式">
        <option value="name">按名称</option>
        <option value="size">按大小</option>
        <option value="modified">按更新时间</option>
      </select>
      <button type="button" class="action" id="sort-direction">升序</button>
      <select id="page-size" aria-label="每页数量">
        <option value="10">10 条/页</option>
        <option value="30">30 条/页</option>
        <option value="50">50 条/页</option>
      </select>
      <button type="button" class="action" id="batch-download" disabled>批量下载</button>
      <button type="button" class="action danger" id="batch-delete" disabled>批量删除</button>
      <span id="selected-count"></span>
    </div>
    <div id="mkdir-form" class="mkdir-form">
      <div class="mkdir-box">
        <div class="mkdir-title">新建目录</div>
        <input
          id="mkdir-name"
          type="text"
          placeholder="输入目录名称"
          maxlength="64"
        />
        <div id="mkdir-hint" class="mkdir-hint">
          仅支持中文、英文、数字、- 和 _
        </div>
        <div class="mkdir-actions">
          <button type="button" id="mkdir-cancel">取消</button>
          <button type="button" id="mkdir-submit">创建</button>
        </div>
      </div>
    </div>
    <section class="list">
      <div class="row muted">
        <b></b><b>名称</b><b>大小</b><b class="date">修改时间</b><b></b>
      </div>
      <div id="items"></div>
    </section>
    <div class="pager">
      <button type="button" id="prev-page" disabled>上一页</button>
      <span id="page-info"></span>
      <button type="button" id="next-page" disabled>下一页</button>
    </div>
  </main>
  <div id="preview-modal" class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="preview-title">
    <div class="preview-box">
      <div class="preview-head"><h2 id="preview-title">预览</h2><button type="button" id="preview-close" aria-label="关闭">关闭</button></div>
      <div id="preview-body" class="preview-body"></div>
    </div>
  </div>
  <script src="/vendor/marked.min.js" defer></script>
  <script src="/vendor/purify.min.js" defer></script>
  <script src="/app.js?v=3" defer></script>
</html>
