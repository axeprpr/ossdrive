name: Build and deploy OSSDrive

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        default: test
        type: choice
        options: [test, production]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.environment == 'test' || inputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go mod tidy
      - run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o ossdrive-linux-amd64 .
      - uses: actions/upload-artifact@v4
        with:
          name: ossdrive-linux-amd64
          path: ossdrive-linux-amd64

  deploy-test:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && inputs.environment == 'test'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ossdrive-linux-amd64
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy test container
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          chmod +x ossdrive-linux-amd64
          sshpass -e scp -o StrictHostKeyChecking=no ossdrive-linux-amd64 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/ossdrive-linux-amd64"
          sshpass -e ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "SUDO_PASSWORD='$SSHPASS' bash -s" <<'REMOTE'
          set -euo pipefail
          env_lines=$(printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker inspect ossdrive-test --format '{{range .Config.Env}}{{println .}}{{end}}' | awk '/^(OSS_|PORT=)/')
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker stop ossdrive-test || true
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker rm ossdrive-test || true
          env_args=(); while IFS= read -r line; do env_args+=("-e" "$line"); done <<< "$env_lines"
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker create --name ossdrive-test --restart unless-stopped -p 5001:3000 "${env_args[@]}" -e PORT=3000 alpine:3.20 /ossdrive
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker cp /tmp/ossdrive-linux-amd64 ossdrive-test:/ossdrive
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker start ossdrive-test
          REMOTE

  deploy-production:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ossdrive-linux-amd64
      - run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy production container
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          chmod +x ossdrive-linux-amd64
          sshpass -e scp -o StrictHostKeyChecking=no ossdrive-linux-amd64 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/ossdrive-linux-amd64"
          sshpass -e ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "SUDO_PASSWORD='$SSHPASS' bash -s" <<'REMOTE'
          set -euo pipefail
          env_lines=$(printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker inspect ossdrive --format '{{range .Config.Env}}{{println .}}{{end}}' | awk '/^(OSS_|PORT=)/')
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker stop ossdrive || true
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker rm ossdrive || true
          env_args=(); while IFS= read -r line; do env_args+=("-e" "$line"); done <<< "$env_lines"
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker create --name ossdrive --restart unless-stopped -p 5000:3000 "${env_args[@]}" -e PORT=3000 alpine:3.20 /ossdrive
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker cp /tmp/ossdrive-linux-amd64 ossdrive:/ossdrive
          printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker start ossdrive
          REMOTE
